<?xml version="1.0" encoding="utf-8" standalone="no" ?>
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="-115 -215 330 430"
     width="330"
     height="430">
<title>Algebraic curve y^2 - x^3 = 0</title>
<desc>
	This is the file
	   http://commons.wikimedia.org/wiki/File:Cusp.svg
	It shows the cusp of the semicubical parabola
	  y^2 = x^3
</desc>
<defs>
<path id="tick-y" d="M-0.08 0 H0.08" />
<use  id="tick-x" xlink:href="#tick-y" transform="rotate(90)"/>
<g id="pack1">
	<!-- non-integral ticks -->
	<path stroke="gray"  stroke-width="0.003" d="M-3 0.25 H3 M-3 0.5 H3 M-3 0.75 H3"/>
	<!-- non-integral gridline -->
	<path stroke="black" stroke-width="0.01"  d="M-0.05 0.25 H0.05 M-0.05 0.5 H0.05 M-0.05 0.75 H0.05"/>
</g>
<g id="pack2">
	<use xlink:href="#pack1"/>
	<use xlink:href="#pack1" y="1"/>
	<use xlink:href="#pack1" y="2"/>
</g>
<g id="pack4">
	<use xlink:href="#pack2"/>
	<use xlink:href="#pack2" transform="rotate(180)"/>
</g>
<style type="text/css">
	text {font-size:20px;}
	.it {font-style:italic; font-size:22px;}
	.curve {stroke:#3b3; stroke-opacity:0.8; stroke-width:0.05; }
</style>
</defs>
<!-- ################################################################### -->
<!-- Background -->
<rect x="-115" y="-215" width="100%" height="100%" fill="white" fill-opacity="0.7" />


<g fill="none" transform="scale(100 -100)">
	<!-- coarse Grid -->
	<g stroke="gray" stroke-width="0.008">
		<path d="M-3 2 H3 M-3 1 H3 M-3 -1 H3 M-3 -2 H3"/>
		<path d="M-1 -3 V3 M1 -3 V3 M2 -3 V3"/>
	</g>
	<!-- fine Grid and fine Ticks -->
	<use xlink:href="#pack4"/>
	<use xlink:href="#pack4" transform="rotate(90)"/>
	<!-- Axes -->
	<g stroke="black" stroke-width="0.025" >
		<!-- x-Axis -->
		<path d="M -3 0  H 2.5"/>
		<!-- y-Axis -->
		<path d="M 0 -12 V 2.5" />
	</g>
	<!-- Ticks -->
	<g stroke="black" stroke-width="0.02">
		<!-- Ticks for y-Axis -->
		<use xlink:href="#tick-x" x="-1" />
		<use xlink:href="#tick-x" x="1" />
		<use xlink:href="#tick-x" x="2" />
		<!-- Ticks for y-Axis -->
		<use xlink:href="#tick-y" y="-2" />
		<use xlink:href="#tick-y" y="-1" />
		<use xlink:href="#tick-y" y="1" />
		<use xlink:href="#tick-y" y="2" />
    </g>
	<!-- The semicubical parabola y^2 = x^3 -->
	<!-- P0=(x0,y0)=(t^2, a*t^3)
	   x1 = x2 = -x0/3 = -x3 / 3
	   y0 = y2 = -y1 = -y3  -->
	<path class="curve" d="M 9 27 C -3 -27 -3 27 9 -27" />

</g>
<!-- Labels for x-Axis -->
<!-- &#8722; = &minus; -->
<g style="text-anchor:middle" transform="translate(0 30)">
  <text x="-100">&#8722;1</text>
  <text x="100" >1</text>
  <text x="200" >2</text>
  <text stroke="white" stroke-opacity="0.6" stroke-width="5" x="200" y="-50"><tspan class="it">x</tspan></text>
  <text x="200" y="-50"><tspan class="it">x</tspan></text>
</g>
<!-- Labels for y-Axis -->
<g style="text-anchor:end" transform="translate(-12 7)">
  <text y="-200">2</text>
  <text y="-100">1</text>
  <text y="100" >&#8722;1</text>
  <text y="200" >&#8722;2</text>
  <text stroke="white" stroke-opacity="0.6" stroke-width="5" x="40" y="-200"><tspan class="it">y</tspan></text>
  <text x="40" y="-200"><tspan class="it">y</tspan></text>
</g>
</svg>
